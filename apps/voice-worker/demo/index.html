<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >
  <title>Neuromind Voice Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07101f;
      color: #ecf4ff;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      padding: 24px;
      border: 1px solid #263957;
      border-radius: 20px;
      background: #101c30;
      box-shadow: 0 20px 70px #0008;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 48px);
    }

    p {
      color: #a9bad2;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #b9c8db;
      font-size: 13px;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid #304868;
      border-radius: 10px;
      background: #081323;
      color: white;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #start {
      background: #51e0a8;
      color: #052118;
    }

    #stop {
      background: #f16e7d;
      color: white;
    }

    #interrupt {
      background: #ffd166;
      color: #382700;
    }

    #state {
      padding: 8px 12px;
      border-radius: 999px;
      background: #081323;
    }

    .transcript {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .bubble {
      padding: 14px 16px;
      border-radius: 14px;
      white-space: pre-wrap;
    }

    .user {
      margin-left: 10%;
      background: #17345a;
    }

    .assistant {
      margin-right: 10%;
      background: #153b31;
    }

    pre {
      overflow: auto;
      max-height: 240px;
      padding: 14px;
      border-radius: 12px;
      background: #060d18;
      color: #8eabc9;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Voice Lab</h1>

      <p>
        Micrófono, detección de turnos,
        interrupción y respuesta hablada.
      </p>

      <div class="grid">
        <label>
          Servidor WebSocket
          <input
            id="endpoint"
            value="ws://127.0.0.1:4100/v1/voice/stream"
          >
        </label>

        <label>
          Token
          <input
            id="token"
            value="unsafe-demo"
          >
        </label>

        <label>
          Empresa
          <input
            id="company"
            value="demo"
          >
        </label>

        <label>
          Idioma
          <select id="language">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="start">Iniciar llamada</button>
        <button id="interrupt" disabled>
          Interrumpir
        </button>
        <button id="stop" disabled>
          Finalizar
        </button>
        <span id="state">Desconectado</span>
      </div>

      <div
        id="transcript"
        class="transcript"
      ></div>

      <details>
        <summary>Eventos técnicos</summary>
        <pre id="events"></pre>
      </details>
    </section>
  </main>

  <script
    type="module"
    src="./app.js"
  ></script>
</body>
</html>
