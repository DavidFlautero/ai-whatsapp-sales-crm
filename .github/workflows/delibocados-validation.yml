name: Delibocados validation

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/dashboard/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/delibocados-validation.yml"
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @ventas/api typecheck
      - name: Test restaurant intent routing
        run: pnpm --filter @ventas/api exec tsx --test src/services/agent/restaurant-ops-conversation.test.ts src/services/restaurant-ops/restaurant-zones.test.ts src/services/restaurant-ops/restaurant-whatsapp-checkout.test.ts src/services/restaurant-ops/restaurant-checkout-dialogue.test.ts src/services/restaurant-ops/restaurant-payment-intake.test.ts src/services/restaurant-ops/restaurant-natural-agent.test.ts src/services/restaurant-ops/restaurant-agent-business.test.ts
      - name: Typecheck dashboard
        run: pnpm --filter @ventas/dashboard typecheck
      - name: Build isolated Delibocados dashboard
        env:
          DELIBOCADOS_BUILD: "1"
          NEXT_PUBLIC_PANEL_INSTANCE: delibocados
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: pnpm --filter @ventas/dashboard exec next build
