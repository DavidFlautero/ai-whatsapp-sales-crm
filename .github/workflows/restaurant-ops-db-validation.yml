name: Restaurant OS database validation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261106170000_restaurant_operations_core.sql"
      - "supabase/migrations/20261106200000_restaurant_payment_review.sql"
      - "supabase/migrations/20261107103000_restaurant_agent_business_learning.sql"
      - "supabase/migrations/20261107124500_restaurant_customer_history_claims.sql"
      - "supabase/migrations/20261107190000_restaurant_verified_split_payments.sql"
      - "supabase/migrations/20261108043000_delibocados_approved_origin_address.sql"
      - "apps/api/src/scripts/delibocados-approved-address-smoke.sql"
      - "apps/api/src/scripts/restaurant-split-payment-smoke.sql"
      - "apps/api/src/scripts/restaurant-customer-history-smoke.sql"
      - "apps/api/src/scripts/restaurant-payment-review-smoke.sql"
      - "apps/api/src/scripts/restaurant-ops-schema-smoke.sql"
      - ".github/workflows/restaurant-ops-db-validation.yml"
  workflow_dispatch:

jobs:
  postgres-order-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: restaurant_ci
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create isolated reference tables and menu fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role;
          CREATE TABLE public.commerce_companies(id text PRIMARY KEY);
          CREATE TABLE public.commerce_schema_migrations(version text PRIMARY KEY, description text);
          CREATE TABLE public.restaurant_menu_documents(
            company_id text PRIMARY KEY,
            revision integer NOT NULL,
            payload jsonb NOT NULL
          );
          INSERT INTO public.commerce_companies(id) VALUES('delibocados');
          INSERT INTO public.restaurant_menu_documents(company_id,revision,payload)
          VALUES('delibocados',1,'{"products":[
            {"id":"burger","name":"Hamburguesa","priceCOP":18000,"available":true},
            {"id":"soda","name":"Gaseosa","priceCOP":5000,"available":true},
            {"id":"unavailable","name":"No disponible","priceCOP":3000,"available":false}
          ]}'::jsonb);
          SQL
      - name: Apply restaurant migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106170000_restaurant_operations_core.sql
      - name: Test real database operations and audit
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/restaurant-ops-schema-smoke.sql
      - name: Apply restaurant payment review migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106200000_restaurant_payment_review.sql
      - name: Test transfer proof review, holds and audit
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/restaurant-payment-review-smoke.sql
      - name: Apply native restaurant agent configuration schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107103000_restaurant_agent_business_learning.sql
      - name: Verify isolated agent settings and learning tables
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/restaurant-agent-business-smoke.sql
      - name: Apply customer history and complaint schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107124500_restaurant_customer_history_claims.sql
      - name: Verify persisted customer order profile and idempotent complaints
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/restaurant-customer-history-smoke.sql
      - name: Apply verified split payments
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107190000_restaurant_verified_split_payments.sql
      - name: Verify split bank proof, hold and exact cash settlement
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/restaurant-split-payment-smoke.sql
      - name: Apply selected Delibocados restaurant origin address
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108043000_delibocados_approved_origin_address.sql
      - name: Assert address is saved but geofences and GPS are not fabricated
        run: psql -v ON_ERROR_STOP=1 -f apps/api/src/scripts/delibocados-approved-address-smoke.sql
