name: VPS deploy script syntax

on:
  push:
    paths:
      - "scripts/deploy/restaurant-ops-v1.sh"
      - "scripts/deploy/delibocados-test-only.sh"
      - "scripts/deploy/delibocados-toteat-outbox-apply.sh"
      - ".github/workflows/restaurant-deploy-script-validation.yml"
  pull_request:
    paths:
      - "scripts/deploy/delibocados-test-only.sh"
      - "scripts/deploy/delibocados-toteat-outbox-apply.sh"
      - "scripts/deploy/restaurant-ops-v1.sh"
      - ".github/workflows/restaurant-deploy-script-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bash deployment syntax
        run: |
          bash -n scripts/deploy/restaurant-ops-v1.sh
          bash -n scripts/deploy/delibocados-test-only.sh
          bash -n scripts/deploy/delibocados-toteat-outbox-apply.sh
      - name: Enforce paused-AI deployment gate
        run: |
          grep -Fq 'touch /root/delibocados-ai.stop' scripts/deploy/restaurant-ops-v1.sh
          grep -Fq 'touch /root/delibocados-ai.stop' scripts/deploy/delibocados-toteat-outbox-apply.sh
          if grep -Eq 'rm[[:space:]]+(-f[[:space:]]+)?/root/delibocados-ai.stop' scripts/deploy/restaurant-ops-v1.sh; then
            printf '%s\n' "Forbidden: deploy script may not remove AI stop file"
            false
          fi

